# /etc/systemd/system/gpsd.service.d/rail.conf
#
# Power the AIO v2 GPS rail before gpsd starts and cut it when gpsd stops.
# The receiver sits on UART2 (/dev/ttyS2), see docs/aio-v2.md.

[Service]
ExecStartPre=/usr/local/bin/aio gps on
ExecStartPre=/bin/sleep 2
ExecStopPost=/usr/local/bin/aio gps off
