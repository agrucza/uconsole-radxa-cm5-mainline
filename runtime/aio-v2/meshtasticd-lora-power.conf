# /etc/systemd/system/meshtasticd.service.d/lora-power.conf
#
# For the AIO v2 with the LoRa MISO wire (docs/aio-v2.md, "The one-wire fix"),
# booted with the aio-lora DTB (/dev/spidev5.0).
#
# Power-cycle the LoRa rail before meshtasticd starts, do not just switch it
# on: the SX1262 on this board was seen to stay dark after a reset pulse on
# its NRESET pin until its supply had been off once, and meshtasticd resets
# the chip at start. The GPS rail too, because meshtasticd reads the
# receiver on /dev/ttyS2.

[Service]
# /dev/spidev5.0 is root:spidev; the daemon runs as user meshtasticd
SupplementaryGroups=spidev
ExecStartPre=/usr/local/bin/aio lora off
ExecStartPre=/bin/sleep 2
ExecStartPre=/usr/local/bin/aio lora on
ExecStartPre=/usr/local/bin/aio gps on
ExecStartPre=/bin/sleep 1
ExecStopPost=/usr/local/bin/aio lora off
