# /etc/systemd/system/meshtasticd.service.d/lora-power.conf
#
# REFERENCE ONLY. LoRa on the AIO v2 does not work with a Radxa CM5: the
# SX1262's MISO line (Pi GPIO19, header pin 35) is not connected on the CM5.
# See docs/aio-v2.md. Kept for the day a bodge wire or a CM5 variant of the
# AIO makes the chip reachable.
#
# Switch the LoRa rail on before meshtasticd starts. The GPS rail too, because
# meshtasticd reads the receiver on /dev/ttyS2.

[Service]
ExecStartPre=/usr/local/bin/aio lora on
ExecStartPre=/usr/local/bin/aio gps on
ExecStartPre=/bin/sleep 1
ExecStopPost=/usr/local/bin/aio lora off
